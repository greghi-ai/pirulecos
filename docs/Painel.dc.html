<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="assets/icone-32.png">
<link rel="apple-touch-icon" href="assets/icone-180.png">
<title>Pirulecos – Painel: cadastrar peça</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F3EC; color: #3B2A1A; font-family: Nunito, system-ui, sans-serif; font-size: 16px; line-height: 1.5">
<header style="background: #3B2A1A; color: #FFF9EF; padding: 16px 20px; display: flex; align-items: center; justify-content: space-between">
<div><div style="font-size: 12px; font-weight: 700; color: #E9DCC6">Painel Pirulecos</div><div style="font-family: Fredoka, sans-serif; font-weight: 600; font-size: 22px">Nova peça</div></div>
<button type="button" aria-label="Fechar" style="width: 44px; height: 44px; border-radius: 999px; border: 0; background: #57412C; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFF9EF" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</header>

<div style="height: 680px; overflow-y: auto; padding: 16px 20px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 800">Fotos <span style="font-weight: 600; color: #6E5A45; font-size: 14px">(frente, costas, etiqueta, detalhe)</span></div>
<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
<div style="aspect-ratio: 3 / 4; border-radius: 14px; background: #FCE1EC; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 64 64" fill="none" stroke="#A42E5E" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M24 8 L26 18 L14 54 L50 54 L38 18 L40 8 M26 18 C30 21 34 21 38 18"></path></svg></div>
<div style="aspect-ratio: 3 / 4; border-radius: 14px; background: #FCE1EC; display: flex; align-items: center; justify-content: center"><svg width="28" height="28" viewBox="0 0 64 64" fill="none" stroke="#A42E5E" stroke-width="3" stroke-linejoin="round" aria-hidden="true"><path d="M24 8 L26 18 L14 54 L50 54 L38 18 L40 8"></path></svg></div>
<button type="button" aria-label="Tirar foto" style="aspect-ratio: 3 / 4; border-radius: 14px; border: 2px dashed #A8957E; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3B2A1A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"></path><circle cx="12" cy="13" r="3.5"></circle></svg></button>
<button type="button" aria-label="Escolher da galeria" style="aspect-ratio: 3 / 4; border-radius: 14px; border: 2px dashed #A8957E; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#3B2A1A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</section>

<div style="display: flex; flex-direction: column; gap: 4px"><label for="nm" style="font-weight: 800">Nome da peça</label><input id="nm" value="Vestido de malha florido" style="height: 48px; box-sizing: border-box; border: 2px solid #E8DCC8; border-radius: 14px; padding: 0 14px; font: inherit; background: #FFFFFF"></div>

<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 800">Tamanho</div>
<div role="group" aria-label="Tamanho" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{sizes}}" as="c" hint-placeholder-count="10">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</section>

<section style="display: flex; flex-direction: column; gap: 8px">
<div style="font-weight: 800">Estado</div>
<div role="group" aria-label="Estado" style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{conds}}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</section>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pr" style="font-weight: 800">Preço</label><input id="pr" inputmode="decimal" value="R$ 39,90" style="height: 48px; box-sizing: border-box; border: 2px solid #E8DCC8; border-radius: 14px; padding: 0 14px; font: inherit; background: #FFFFFF; min-width: 0"></div>
<div style="display: flex; flex-direction: column; gap: 4px"><label for="pc" style="font-weight: 800">Pacote</label><select id="pc" style="height: 48px; box-sizing: border-box; border: 2px solid #E8DCC8; border-radius: 14px; padding: 0 10px; font: inherit; background: #FFFFFF; min-width: 0"><option>Pequeno</option><option>Médio</option><option>Grande</option></select></div>
</div>
<p style="margin: -8px 0 0; font-size: 13px; color: #6E5A45">O pacote define peso e medidas para o frete dos Correios.</p>

<div style="display: flex; flex-direction: column; gap: 4px"><label for="ob" style="font-weight: 800">Detalhe do estado <span style="font-weight: 600; color: #6E5A45; font-size: 14px">(opcional)</span></label><textarea id="ob" rows="2" style="box-sizing: border-box; border: 2px solid #E8DCC8; border-radius: 14px; padding: 10px 14px; font: inherit; background: #FFFFFF; resize: none">Pequena marca de uso na barra.</textarea></div>
</div>

<div style="position: absolute; left: 0; right: 0; bottom: 0; background: #FFFFFF; border-top: 1px solid #E8DCC8; padding: 12px 20px 16px">
<sc-if value="{{notDone}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{publish}}" style="width: 100%; min-height: 54px; border-radius: 999px; border: 0; background: #C65A0E; color: #FFFFFF; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer">Publicar na loja</button>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<div role="status" style="min-height: 54px; border-radius: 999px; background: #DFF2DA; color: #2B6E33; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 8px"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2B6E33" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l4 4 10-10"></path></svg>No ar! Clientes do tam. {{size}} serão avisados</div>
</sc-if>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: '4', cond: 'Ótimo estado', done: false };
  }
  renderVals() {
    var self = this;
    var s = this.state;
    var chip = function (on) {
      return 'min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 12px; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer; ' + (on ? 'background: #3B2A1A; color: #FFFFFF; border: 2px solid #3B2A1A;' : 'background: #FFFFFF; color: #3B2A1A; border: 2px solid #E8DCC8;');
    };
    var sizes = ['RN', '0–3m', '3–6m', '6–9m', '9–12m', '1', '2', '3', '4', '6', '8', '10', '12', '14'].map(function (x) {
      return { label: x, pressed: x === s.size ? 'true' : 'false', style: chip(x === s.size), pick: function () { self.setState({ size: x, done: false }); } };
    });
    var conds = ['Como novo', 'Ótimo estado', 'Bom estado'].map(function (x) {
      return { label: x, pressed: x === s.cond ? 'true' : 'false', style: chip(x === s.cond), pick: function () { self.setState({ cond: x, done: false }); } };
    });
    return {
      sizes: sizes, conds: conds, size: s.size,
      done: s.done, notDone: !s.done,
      publish: function () { self.setState({ done: true }); }
    };
  }
}
</script>
</body>
</html>
